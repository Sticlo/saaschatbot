<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Omitel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Omitel — WhatsApp con IA para vender y atender mejor.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var key = 'omitel.theme';
      var saved = localStorage.getItem(key);
      var theme =
        saved === 'dark' || saved === 'light'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root>
    <div class="app-boot">Cargando Omitel…</div>
  </app-root>
</body>
</html>

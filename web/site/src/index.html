<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Omitel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Omitel — WhatsApp con IA para vender y atender mejor.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    window.__omitelBootTimer = window.setTimeout(function () {
      var boot = document.querySelector('app-root .app-boot');
      if (!boot) return;
      boot.innerHTML =
        'Omitel no terminó de cargar. ' +
        '<a href="javascript:location.reload()" style="color:#ff6b00">Recargar</a>';
    }, 12000);
  </script>
</head>
<body>
  <app-root>
    <div class="app-boot">Cargando Omitel…</div>
  </app-root>
</body>
</html>

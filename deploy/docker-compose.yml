# Infraestructura local: Postgres + Redis + Evolution
# Uso: docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: saaschatbot_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saaschatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-saaschatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saaschatbot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    profiles: ["evolution"]
    image: evoapicloud/evolution-api:v2.2.3
    container_name: saaschatbot_evolution
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      SERVER_URL: http://localhost:8080
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-saaschatbot}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_SAVE_INSTANCES: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  waha:
    image: devlikeapro/waha:latest
    container_name: saaschatbot_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ../.env
    environment:
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-WEBJS}
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key-local}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY:-dev-waha-key-local}
      WAHA_APPS_ENABLED: "true"
      WAHA_APPS_ON: chatwoot
      REDIS_URL: redis://redis:6379/3
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    depends_on:
      redis:
        condition: service_healthy
      chatwoot:
        condition: service_started

  chatwoot:
    image: chatwoot/chatwoot:v3.16.0
    container_name: saaschatbot_chatwoot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      INSTALLATION_ENV: docker
      RAILS_ENV: production
      NODE_ENV: production
      FRONTEND_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change-me-chatwoot-secret-key-min-32-chars}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USER:-saaschatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379/2
      ACTIVE_STORAGE_SERVICE: local
      RAILS_LOG_TO_STDOUT: "true"
      RACK_TIMEOUT_SERVICE_TIMEOUT: "60"
      CONVERSATION_MESSAGE_PER_MINUTE_LIMIT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:v3.16.0
    container_name: saaschatbot_chatwoot_sidekiq
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      INSTALLATION_ENV: docker
      RAILS_ENV: production
      NODE_ENV: production
      FRONTEND_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:-change-me-chatwoot-secret-key-min-32-chars}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USER:-saaschatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379/2
      ACTIVE_STORAGE_SERVICE: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  postgres_data:
  redis_data:
  waha_sessions:
  waha_media:

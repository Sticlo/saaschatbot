# Producción — API y workers en procesos separados (escala horizontal).
#
# Desde la raíz del repo:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml up -d --scale worker-webhook=5 --scale worker-outbound=15 --scale worker-ai=3

x-app-build: &app-build
  context: ../backend
  dockerfile: Dockerfile

x-app-env: &app-env
  env_file:
    - ../.env
  environment:
    APP_ENV: production
    DEBUG: "false"
    EMBED_WORKERS_IN_API: "false"
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saaschatbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saaschatbot}
    REDIS_URL: redis://redis:6379/0
    EVOLUTION_API_URL: http://evolution:8080
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-worker: &worker
  build: *app-build
  restart: unless-stopped
  <<: *app-env
  command: python -m app.worker webhook

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saaschatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-saaschatbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      WEBHOOK_GLOBAL_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: *app-build
    restart: unless-stopped
    <<: *app-env
    ports:
      - "8000:8000"
    command: >
      gunicorn app.presentation.main:app
      -w 4
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -

  worker-webhook:
    <<: *worker
    command: python -m app.worker webhook

  worker-outbound:
    <<: *worker
    command: python -m app.worker outbound

  worker-ai:
    <<: *worker
    command: python -m app.worker ai

  worker-ai-primary:
    <<: *worker
    command: python -m app.worker ai --recover-ai

volumes:
  postgres_data:
  redis_data:

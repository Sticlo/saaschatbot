# Producción — API y workers en procesos separados, detrás de Caddy (HTTPS automático).
#
# Desde la raíz del repo (con .env completo, ver deploy/env.production.example):
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d --scale worker-ai=3
#
# Solo Caddy publica puertos (80/443). Postgres, Redis, Evolution y la API quedan en la red
# interna de Docker.

x-app-build: &app-build
  context: ..
  dockerfile: backend/Dockerfile

x-app-env: &app-env
  env_file:
    - ../.env
  environment:
    APP_ENV: production
    DEBUG: "false"
    EMBED_WORKERS_IN_API: "false"
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-saaschatbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-saaschatbot}
    REDIS_URL: redis://redis:6379/0
    EVOLUTION_API_URL: http://evolution:8080
    EVOLUTION_IN_DOCKER: "true"
    EVOLUTION_DATABASE_URL: postgresql://${POSTGRES_USER:-saaschatbot}:${POSTGRES_PASSWORD}@postgres:5432/evolution
    EVOLUTION_WEBHOOK_INTERNAL_URL: http://api:8000
    WHATSAPP_PROVIDER: evolution
    CHATWOOT_ENABLED: "false"
    # La API solo la alcanza Caddy: confiar en sus X-Forwarded-For para IP real (rate limit).
    FORWARDED_ALLOW_IPS: "*"

x-app: &app
  build: *app-build
  restart: unless-stopped
  <<: *app-env
  volumes:
    - tenant_assets:/app/app/static/assets
    # Fotos, audios y documentos de los chats.
    - chat_media:/app/app/static/media
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.omitel.net}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env (avisos de Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saaschatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-saaschatbot}
    command: postgres -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea la base «evolution» la primera vez que arranca el volumen.
      - ./postgres-init/01-evolution-db.sh:/docker-entrypoint-initdb.d/01-evolution-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Copia diaria de las bases en deploy/backups/ del servidor (se conservan 14 días).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-saaschatbot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saaschatbot}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution:
    build:
      context: ./evolution
    image: omitel/evolution-api:2.2.3-omitel
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Define EVOLUTION_API_KEY en .env}
      SERVER_URL: http://evolution:8080
      DEL_INSTANCE: "false"
      # Sesiones de WhatsApp en Postgres: un reinicio no desvincula a los negocios.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-saaschatbot}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_omitel
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      # Omitel solo atiende chats que llegan después de escanear el QR: el historial del
      # celular no se guarda (ahorra espacio y respaldos).
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Versión de WhatsApp Web; si falla la vinculación por QR, actualizarla (client_revision
      # de web.whatsapp.com/sw.js).
      CONFIG_SESSION_PHONE_VERSION: ${CONFIG_SESSION_PHONE_VERSION:?Define CONFIG_SESSION_PHONE_VERSION en .env}
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: *app-build
    <<: *app-env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: >
      gunicorn app.presentation.main:app
      -w 4
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker-webhook:
    <<: *app
    command: python -m app.worker webhook

  worker-ai:
    <<: *app
    command: python -m app.worker ai

  worker-ai-primary:
    <<: *app
    command: python -m app.worker ai --recover-ai

  worker-sync:
    <<: *app
    command: python -m app.worker sync

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  tenant_assets:
  chat_media:
  caddy_data:
  caddy_config:
